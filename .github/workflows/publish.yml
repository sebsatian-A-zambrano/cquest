name: Publish CQuest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cquest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Test local save merging
        run: |
          npm run test:save
          python -m unittest discover -s test -p test_progress.py
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test --reporter expanded
      - name: Build downloadable game
        run: |
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none
          python tool/prepare_release.py --archive dist/cquest-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cquest-download
          path: dist/cquest-web.zip*
      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Build for repository URL
        if: github.ref == 'refs/heads/main'
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none --base-href "${BASE_PATH}/"
          python tool/prepare_release.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cquest-download
          path: dist
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/cquest-web.zip dist/cquest-web.zip.sha256 --verify-tag --title "CQuest $TAG" --notes-file RELEASE_NOTES.md
